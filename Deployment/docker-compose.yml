# Chạy trên VPS: docker compose -f Deployment/docker-compose.yml up -d --build
# Đặt DOMAIN trong file .env cạnh file này (ví dụ DOMAIN=bida.example.com). Caddy tự xin chứng chỉ HTTPS.
services:
  game:
    build:
      context: ..
      dockerfile: Deployment/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      PUBLIC_URL: "https://${DOMAIN:-localhost}"
      TURN_TIME_MS: "${TURN_TIME_MS:-60000}"
      RECONNECT_GRACE_MS: "${RECONNECT_GRACE_MS:-60000}"
    volumes:
      - gamedata:/data
    expose:
      - "8080"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [game]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:-localhost}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  gamedata:
  caddy_data:
  caddy_config:
