# Triển khai miễn phí lên Render.com: Dashboard → New → Blueprint → chọn repo này.
services:
  - type: web
    name: vigo-billiards-party
    runtime: docker
    dockerfilePath: ./Deployment/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8080"
      - key: DATA_DIR
        value: ""
      - key: TURN_TIME_MS
        value: "60000"
